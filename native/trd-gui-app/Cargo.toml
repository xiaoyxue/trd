[package]
name = "trd-gui-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "trd-gui-app"
path = "src/main.rs"

# The native eframe shell is a delivery surface around the reusable trd-gui
# library. Keeping these dependencies target-specific lets workspace wasm checks
# compile the crate's empty wasm main without pulling in native windowing.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
trd-core.workspace = true
trd-gui = { path = "../../crates/trd-gui" }
clap = { version = "4", features = ["derive"] }
eframe = "0.35"
egui = "0.35"
env_logger = "0.11"
log = "0.4"
