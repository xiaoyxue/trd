[package]
name = "trd-gui-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "trd-gui-app"
path = "src/main.rs"

# The native eframe shell is a delivery surface around the reusable trd-gui
# library. Native-only, so its dependencies are plain rather than target-gated.
[lints]
workspace = true

[dependencies]
trd-core.workspace = true
trd-gui = { path = "../../crates/trd-gui" }
clap = { version = "4", features = ["derive"] }
eframe = "0.36.1"
egui = "0.36.1"
env_logger = "0.11"
log = "0.4"
pollster = "0.4"
