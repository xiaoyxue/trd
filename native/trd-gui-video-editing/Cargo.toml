[package]
name = "trd-gui-video-editing"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "trd-gui-video-editing"
path = "src/main.rs"

# Native-only delivery surface; dependencies are plain, not target-gated.
[lints]
workspace = true

[dependencies]
trd-core.workspace = true
trd-gui = { path = "../../crates/trd-gui" }
clap = { version = "4", features = ["derive"] }
eframe = "0.36.1"
egui = "0.36.1"
env_logger = "0.11"
log = "0.4"
pollster = "0.4"
rfd = "0.17.2"
thiserror = "2"
ureq = { version = "3.4.0", default-features = false, features = ["rustls"] }
