[package]
name = "trd-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "trd-app"
path = "src/main.rs"

# trd-app is a native-only delivery surface (winit window + live wgpu surface),
# so its dependencies are plain, not target-gated: nothing ever builds this
# binary for wasm.
[lints]
workspace = true

[dependencies]
trd-core.workspace = true
wgpu = "30"
winit = "0.30"
pollster = "0.4"
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
thiserror = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "hdr"] }
ureq = { version = "3.4.0", default-features = false, features = ["rustls"] }
