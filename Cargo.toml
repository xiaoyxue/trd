[package]
name = "trd"
version = "0.1.0"
edition = "2021"
description = "A tile (relational) oriented renderer prototype"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "trd-demo"
path = "src/main.rs"

[dependencies]
cfg-if = "1"
log = "0.4"
winit = "0.30"
wgpu = "30"
pollster = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
console_log = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
# Enable the WebGL2 fallback so the demo also runs in browsers without WebGPU.
# WebGPU is still used automatically when the browser supports it.
wgpu = { version = "30", features = ["webgl"] }
web-sys = { version = "0.3", features = [
    "Document",
    "Window",
    "Element",
    "Node",
    "HtmlCanvasElement",
] }
