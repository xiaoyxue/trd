[workspace]
resolver = "2"
members = [
    "crates/trd-core",
    "crates/trd-cli",
    "crates/trd-gui",
    "crates/trd-placement",
    "crates/trd-wasm",
    "native/trd-app",
    "native/trd-gui-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Hong-Xiang/trd"

[workspace.dependencies]
trd-core = { path = "crates/trd-core" }
trd-placement = { path = "crates/trd-placement" }

[workspace.metadata.crane]
name = "trd"

# Optimize dependencies even in dev/debug builds. Workspace crates stay
# unoptimized (fast incremental `cargo build`/`run`), but compute-heavy deps —
# notably `image`/`zune-jpeg` (per-frame background decode in trd-app, #63) and
# the wgpu/naga stack — run at release speed, so the native viewer decodes and
# uploads frames quickly instead of stalling on a debug-mode JPEG decoder.
[profile.dev.package."*"]
opt-level = 3
