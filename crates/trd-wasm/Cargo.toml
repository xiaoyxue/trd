[package]
name = "trd-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# trd-wasm targets the browser only. On non-wasm hosts it compiles to an empty
# crate (see the crate-level cfg in src/lib.rs) so workspace-wide native builds,
# clippy, and tests skip it cleanly instead of failing on web-only wgpu APIs.
[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
# HDR-only `image` decoder (no C deps ⇒ compiles for wasm32): the wasm shell
# decodes the equirectangular `.hdr` env probe for the Disney PBR path, mirroring
# trd-cli's `load_env_map` so trd-core does no file/codec I/O.
image = { version = "0.25", default-features = false, features = ["hdr"] }
js-sys = "0.3"
trd-core.workspace = true
# The GUI entry points live here too: `trd-gui` is a plain rlib holding the UI,
# interaction, and scene authoring; this crate owns its JS ABI (#180).
trd-gui = { path = "../trd-gui" }
egui = "0.35"
eframe = { version = "0.35", default-features = false, features = [
    "glow",
    "default_fonts",
] }
log = "0.4"
wasm-bindgen = "=0.2.121"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "HtmlCanvasElement",
    "Element",
    "Performance",
    "Window",
] }
wgpu = "30"

[lints]
workspace = true
