[package]
name = "trd-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# Downstream CPU-only tests need distinct opaque IDs without acquiring a GPU.
test-support = []

[dependencies]
wgpu = "30"
log = "0.4"
bytemuck = { version = "1", features = ["derive"] }
thiserror = "2"
glam = { version = "0.30", features = ["bytemuck", "approx", "libm"] }
gltf-rs = { package = "gltf", version = "1.4.1", default-features = false, features = [
    "extensions",
    "names",
    "KHR_materials_emissive_strength",
    "KHR_materials_ior",
    "KHR_materials_specular",
    "KHR_materials_transmission",
    "utils",
] }
arrow = { version = "59", default-features = false, features = ["ipc", "canonical_extension_types"] }
arrow-schema = { version = "59", default-features = false, features = ["canonical_extension_types"] }
# Annotation documents also arrive as Parquet, which is what tracking and
# calibration pipelines emit (#264 N4). `default-features = false` is what keeps
# this crate wasm-compatible: the defaults add `zstd`, `lz4` and `brotli`, whose
# C shims do not cross-compile.
#
# `snap` is not optional in practice — it is pyarrow's default compression, so a
# file written by any normal producer needs it — and it is pure Rust, so it
# builds for wasm32. A file using one of the other codecs is rejected with
# parquet's own "Disabled feature at compile time" message rather than failing
# the build for everyone.
parquet = { version = "59", default-features = false, features = ["arrow", "snap"] }
# The parquet reader takes a `ChunkReader`, implemented for `Bytes` and `File`;
# only the former works on wasm. Cargo unifies this with parquet's own copy.
bytes = "1"
# OBJ is trd's default mesh format; `tobj` is the popular pure-Rust loader
# (wasm-compatible). `default-features = false` drops the `ahash` feature for a
# leaner wasm build (falls back to std hashing).
tobj = { version = "4", default-features = false }
# Oneshot channel for the shared offscreen readback (`render/offscreen.rs`): the
# map callback signals completion on both native and wasm (pure Rust, no I/O).
futures-channel = "0.3"
# Inline frame resources are decoded identically in native and wasm builds.
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "0.4"

[dev-dependencies]
proptest = "1"
# `tests/shader_bind_group_budget.rs` compares the shaders' declared `@group`
# indices against `wgpu::Limits::downlevel_defaults().max_bind_groups` rather
# than a hardcoded 4, so the guard tracks the baseline if wgpu ever restates it.
# Same version as the normal dependency above: no extra build.
wgpu = "30"
approx = "0.5"
# The environment-light golden builds a `Renderer` directly (no fixture can draw
# a sky), and its constructor + readback are async.
pollster = "0.4"
