[package]
name = "trd-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "trd_gui"
path = "src/lib.rs"
# A plain library: the browser delivery surface (`crates/trd-wasm`) owns the
# `cdylib` and the JS ABI, so this crate is reusable by every surface without
# dragging wasm-bindgen in (#180).
crate-type = ["rlib"]

# trd-gui is the interactive egui front-end (issue #97). It displays trd-core's
# rendered image stream and turns user interaction (orbit / zoom / translate)
# into an updated model/camera matrix that trd-core re-renders (Strategy A:
# decoupled CPU-RGBA handoff — egui owns its own UI renderer, trd-core renders
# RGBA that the GUI shows as an egui texture, so the toolkits stay independent of
# trd-core's `wgpu 30`).
#
# It targets **both** native and wasm (Slice 4, #97): `native/trd-gui-app`
# runs an eframe window with the synchronous `render_backend`; the wasm library
# (`start`, `web_app`, `wasm_renderer`) runs eframe on a canvas with an async
# offscreen trd-core render.
[lints]
workspace = true

[dependencies]
trd-core.workspace = true
trd-placement.workspace = true
# `error::GuiError` is a shared module (compiled on native + wasm), so its
# derive-macro dep is a general dependency, not native-only.
thiserror = "2"
# egui/log are shared by the native window and the wasm (eframe-web) app.
# `default-features = false` drops egui's one default feature, `default_fonts`,
# which embeds four whole font files (1.4 MB of the wasm, #359). trd installs its
# own subsets in `fonts.rs`. Turning it off in `eframe` alone does nothing —
# cargo unions features, and egui's own default turns it straight back on.
egui = { version = "0.36.1", default-features = false }
# Direct wgpu/egui-wgpu: the editor binds trd's rendered texture into egui
# (`register_native_texture`) when the shell shares eframe's device, which needs
# both types by name. Safe only because one `wgpu 30` resolves for the whole
# tree (#257) — under two versions these would be a *third* incompatible copy.
wgpu = "30"
egui-wgpu = "0.36.1"
log = "0.4"
# `std::time::Instant` panics on `wasm32-unknown-unknown`, so the shared
# video-editing render-latency diagnostic uses `web-time`'s drop-in `Instant`:
# std on native, `performance.now()` in the browser. Already in the tree via egui.
web-time = "1"
# Decode + downscale the optional texture image in Rust (native `--texture` /
# browser `?texture=`) and the optional HDR env probe (native `--env` / browser
# `?env=`), keeping trd-core I/O-free. Pure-Rust png/jpeg/hdr decoders compile on
# both native and wasm, so this is a shared dep.
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "hdr",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The browser target (Slice 4, #97): eframe-on-canvas UI + trd-core rendering the
# scene offscreen (wgpu 30) to RGBA shown as an egui texture (Strategy A). Mirrors
# trd-wasm's wasm-only dep set; trd-core's `MeshRenderer` is available on wasm.
#
# egui runs on **WebGPU** here (`eframe`'s `wgpu` feature), not WebGL2 (`glow`):
# eframe 0.36's `egui-wgpu` is on `wgpu 30`, the same major trd-core uses, so one
# graphics API — and eventually one device — serves both (#257). Without
# `egui-wgpu/webgl` there is no WebGL fallback: a browser without WebGPU fails
# outright. Deliberate — trd's rendering needs WebGPU regardless, so a fallback
# could only draw UI chrome around a dead canvas.
[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { version = "0.36.1", default-features = false, features = [
    "wgpu",
] }
# Only `platform::drive` needs this: `spawn_local` is the browser arm of the
# executor policy this front-end owns (#302). No `web-sys` — the browser frame
# path went behind `trd_core::ExternalFrame`, so no shared crate names a browser
# type any more.
wasm-bindgen-futures = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = "0.36.1"
pollster = "0.4"
