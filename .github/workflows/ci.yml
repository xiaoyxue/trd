name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Nix builds every output from the flake, so CI matches local builds
      # exactly. No apt/rustup/bun setup is needed.
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      # Runs every quality gate defined as a flake check: rustfmt, clippy
      # (native + wasm32), cargo test, tsc, and Biome (format + lint).
      #
      # NOTE on GPU: this runner has no GPU. GPU-dependent render tests are
      # marked `#[ignore]`, so `cargo test` skips them and never creates a wgpu
      # device. Building wgpu is compile-only and needs no GPU.
      - name: Flake checks (rust fmt/clippy/test, tsc, biome)
        run: nix flake check --print-build-logs

      # Builds the servable web bundle (Rust core -> wasm library -> bun dist).
      # This also exercises the trd-cli and trd-wasm package outputs it depends
      # on. `nix run .#web` serves the resulting dist/ over HTTP.
      - name: Build web bundle
        run: nix build .#web --print-build-logs

# Caching is intentionally omitted for a reliable first pass; cold builds mostly
# download prebuilt substitutes from cache.nixos.org. A nix store cache (e.g.
# nix-community/cache-nix-action or a Cachix cache for the crate builds) can be
# added later to speed runs up.
